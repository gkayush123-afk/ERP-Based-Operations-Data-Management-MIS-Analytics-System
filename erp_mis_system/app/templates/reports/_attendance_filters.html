{% set report_titles = {"daily": "Daily report", "weekly": "Weekly report", "monthly": "Monthly report", "department": "Department-wise summary", "summary": "Attendance summary"} %}
<input type="hidden" name="report_mode" value="attendance">
<div class="verification-filter-field period-field" data-for="daily,weekly,monthly">
  <label for="type">Report Type</label>
  <select class="form-select" id="type" name="type">
    {% for value, label in [("daily", "Daily"), ("weekly", "Weekly"), ("monthly", "Monthly"), ("department", "Department-wise summary"), ("summary", "Attendance Summary")] %}
      <option value="{{ value }}" {% if att_filters.type == value %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
<div class="verification-filter-field period-field" data-for="daily,weekly">
  <label for="date">Date / date in selected week</label>
  <input class="form-control" id="date" name="date" type="date" value="{{ att_filters.period_date.isoformat() }}">
</div>
<div class="verification-filter-field period-field" data-for="monthly">
  <label for="month">Month</label>
  <input class="form-control" id="month" name="month" type="month" value="{{ att_filters.period_month.strftime('%Y-%m') }}">
</div>
<div class="verification-filter-field period-field" data-for="department,summary">
  <label for="start_date">From</label>
  <input class="form-control" id="start_date" name="start_date" type="date" value="{{ att_filters.start_date.isoformat() }}">
</div>
<div class="verification-filter-field period-field" data-for="department,summary">
  <label for="end_date">To</label>
  <input class="form-control" id="end_date" name="end_date" type="date" value="{{ att_filters.end_date.isoformat() }}">
</div>
{% if current_user.role == "admin" %}
<div class="verification-filter-field">
  <label for="department_id">Department</label>
  <select class="form-select" id="department_id" name="department_id">
    <option value="">All departments</option>
    {% for department in att_departments %}
      <option value="{{ department.id }}" {% if att_filters.department_id == department.id %}selected{% endif %}>{{ department.name }}</option>
    {% endfor %}
  </select>
</div>
{% endif %}
<div class="verification-filter-field">
  <label for="status">Attendance status</label>
  <select class="form-select" id="status" name="status">
    <option value="">All statuses</option>
    {% for value, label in status_labels.items() %}
      <option value="{{ value }}" {% if att_filters.status == value %}selected{% endif %}>{{ label }}</option>
    {% endfor %}
  </select>
</div>
<div class="verification-filter-actions">
  <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i><span>Run Report</span></button>
  <a class="btn btn-outline-secondary" href="{{ url_for('reports.analytics', report_mode='attendance') }}"><i class="bi bi-arrow-counterclockwise"></i><span>Reset</span></a>
  <a class="btn btn-outline-success ms-md-auto" href="{{ url_for('reports.export', file_format='xlsx', **request.args) }}"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Export Excel</a>
  <a class="btn btn-outline-danger" href="{{ url_for('reports.export', file_format='pdf', **request.args) }}"><i class="bi bi-file-earmark-pdf me-1"></i>Export PDF</a>
</div>
<script>
  (() => {
    const typeSelect = document.getElementById("type");
    const syncPeriodFields = () => {
      document.querySelectorAll(".period-field").forEach((container) => {
        const visible = container.dataset.for.split(",").includes(typeSelect.value);
        container.hidden = !visible;
        container.querySelectorAll("input, select").forEach((input) => { input.disabled = !visible; });
      });
    };
    if (typeSelect) {
      typeSelect.addEventListener("change", syncPeriodFields);
      syncPeriodFields();
    }
  })();
</script>
